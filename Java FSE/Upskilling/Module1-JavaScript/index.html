<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Event Portal - JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .eventImg {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
    </style>
</head>

<body class="bg-light pb-5">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">Community Events</span>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="help.html">Help</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-primary text-white py-4 text-center">
        <div class="container">
            <h1>Community Events Portal</h1>
            <p class="lead">Dynamic updates and registrations powered by JavaScript.</p>
        </div>
    </header>

    <main class="container py-4">
        <section class="mb-4">
            <div class="row g-3 bg-white p-3 rounded shadow-sm">
                <div class="col-md-6">
                    <input type="text" id="searchInput" class="form-control" placeholder="Type to search events..." onkeyup="searchEvents(this.value)">
                </div>
                <div class="col-md-6">
                    <select id="filterSelect" class="form-select" onchange="filterEvents(this.value)">
                        <option value="">All Categories</option>
                        <option value="Music">Music</option>
                        <option value="Workshop">Workshop</option>
                        <option value="Seminar">Seminar</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="mb-5">
            <h2 class="h4 mb-3">Upcoming Events</h2>
            <div id="loadingSpinner" class="text-center my-3" style="display:none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <div id="eventsContainer" class="row"></div>
        </section>

        <section class="mb-5">
            <h2 class="h4 mb-3">Past Event Gallery</h2>
            <div class="row g-3">
                <div class="col-md-4">
                    <img src="./src/img1.webp" class="eventImg" ondblclick="enlargeImage(this)" alt="event image">
                </div>
                <div class="col-md-4">
                    <img src="./src/img2.webp" class="eventImg" ondblclick="enlargeImage(this)" alt="event image">
                </div>
                <div class="col-md-4">
                    <img src="./src/img3.webp" class="eventImg" ondblclick="enlargeImage(this)" alt="event image">
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white py-5 mt-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-md-6">
                    <h3>Contact Us</h3>
                    <p>Email: communityevents@gmail.com</p>
                    <p>Phone: 9876543210</p>
                </div>
                <div class="col-md-6">
                    <h3>Feedback Form</h3>
                    <form onsubmit="submitForm(event)">
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Enter your name" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" id="phone" class="form-control" placeholder="Enter phone number" onblur="validatePhone()" required>
                        </div>
                        <div class="mb-3">
                            <select id="eventType" class="form-select" onchange="showFee()" required>
                                <option value="">Select Event Type</option>
                                <option value="500">Workshop</option>
                                <option value="1000">Hackathon</option>
                                <option value="1500">Seminar</option>
                            </select>
                        </div>
                        <p id="fee" class="fw-bold text-info"></p>
                        <div class="mb-3">
                            <textarea id="feedback" class="form-control" placeholder="Enter your feedback" onkeyup="countCharacters()"></textarea>
                        </div>
                        <p class="text-white-50">Characters Typed: <span id="count" class="text-white">0</span></p>
                        <button type="submit" class="btn btn-danger">Submit Feedback</button>
                    </form>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script>
        function validatePhone() {
            let phone = document.getElementById("phone").value;
            if (phone.length != 10) {
                alert("Phone number should contain 10 digits");
            }
        }

        function showFee() {
            let fee = document.getElementById("eventType").value;
            document.getElementById("fee").innerHTML = fee ? "Event Fee: ₹" + fee : "";
        }

        function countCharacters() {
            let text = document.getElementById("feedback").value;
            document.getElementById("count").innerHTML = text.length;
        }

        function enlargeImage(image) {
            image.style.transform = image.style.transform === "scale(1.2)" ? "scale(1)" : "scale(1.2)";
        }

        function submitForm(event) {
            event.preventDefault();
            alert("Feedback Submitted Successfully!");
        }
    </script>
</body>

</html>
