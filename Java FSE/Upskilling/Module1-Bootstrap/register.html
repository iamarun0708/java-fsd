<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Bootstrap 5</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="help.html">Help</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row g-4">
            <section class="col-lg-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h1 class="h4 mb-4">Registration Form</h1>
                        <form>
                            <div class="mb-3">
                                <label class="form-label" for="name">Name</label>
                                <input class="form-control" id="name" type="text" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="email">Email</label>
                                <input class="form-control" id="email" type="email" required>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text">+91</span>
                                <input class="form-control" type="tel" placeholder="Phone number" aria-label="Phone number">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="eventType">Event Type</label>
                                <select class="form-select" id="eventType" required>
                                    <option value="">Choose event</option>
                                    <option>Workshop</option>
                                    <option>Seminar</option>
                                    <option>Hackathon</option>
                                </select>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="updates">
                                <label class="form-check-label" for="updates">Send event updates</label>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Register</button>
                        </form>
                    </div>
                </div>
            </section>

            <section class="col-lg-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="h4 mb-4">Login Form</h2>
                        <form>
                            <div class="form-floating mb-3">
                                <input class="form-control" id="loginEmail" type="email" placeholder="name@example.com">
                                <label for="loginEmail">Email address</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input class="form-control" id="loginPassword" type="password" placeholder="Password">
                                <label for="loginPassword">Password</label>
                            </div>
                            <button class="btn btn-success w-100" type="submit">Login</button>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
