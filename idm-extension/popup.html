<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Download Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-area">
        <img src="icons/icon48.png" alt="Logo" class="logo-icon">
        <div class="logo-text">
          <h1>APEX</h1>
          <span class="subtitle">DOWNLOAD MANAGER</span>
        </div>
      </div>
      <button id="btn-open-dashboard" class="header-btn" title="Open Full Dashboard">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        <span>Manager</span>
      </button>
    </header>

    <!-- Navigation / Tabs -->
    <nav class="popup-tabs">
      <button class="tab-btn active" data-filter="all">All</button>
      <button class="tab-btn" data-filter="video">Video</button>
      <button class="tab-btn" data-filter="audio">Audio</button>
      <button class="tab-btn" data-filter="compressed">Archives</button>
    </nav>

    <!-- Main List Content -->
    <main class="popup-content">
      <div id="media-list" class="media-list">
        <!-- Dynamically populated -->
        <div class="loading-state">Sniffing active tab...</div>
      </div>
    </main>

    <!-- Footer Status -->
    <footer class="popup-footer">
      <span id="footer-status-text">Ready</span>
      <span class="footer-version">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
